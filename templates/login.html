<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="card" style="max-width:450px; margin:40px auto;">
    <h2>Login</h2>
    <p style="margin-top:8px; margin-bottom:20px; color:#666;">
        Log in to track your nutrition.
    </p>

    <form method="post">
        <label>Username</label>
        <input type="text" name="username" required autofocus>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>

    <p style="margin-top:18px; text-align:center; color:#666;">
        Don't have an account? <a href="/signup" style="color:#2e7d32;">Sign up</a>
    </p>
</div>

{% endblock %}
